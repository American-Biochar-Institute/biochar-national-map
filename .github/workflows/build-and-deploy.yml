name: Build and deploy biochar national map

on:
  workflow_dispatch:
    inputs:
      zoom:
        description: "Compatibility input; map cells are native 30 m"
        required: true
        default: "3-11"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add the site files to the site root
        run: |
          mkdir -p site/draw-images
          cp index.html explorer.html site/
          cp acreage.js acreage-worker.js sectioned-grid.js index-grid.js index-grid.json policy.js site/
          cp fields.js uploads.js biochar_engine.js insights.js turf.min.js site/
          cp hydrology.js hydro-major-rivers.geojson hydro-lakes.geojson interstates.geojson site/
          cp acreage-summary.json counties.geojson states.geojson site/
          cp proj4.js leaflet.js leaflet.css leaflet.draw.js leaflet.draw.css site/
          cp draw-images/* site/draw-images/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
