name: Build and deploy biochar national map

on:
  workflow_dispatch:
    inputs:
      zoom:
        description: "Compatibility input; map cells are native 30 m"
        required: true
        default: "3-11"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add the viewer to the site root
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp acreage.js acreage-worker.js sectioned-grid.js hydrology.js hydro-major-rivers.geojson hydro-lakes.geojson acreage-summary.json proj4.js leaflet.js leaflet.css counties.geojson states.geojson site/
          mkdir -p site/exploratory
          cp exploratory/*-summary.json site/exploratory/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
